[project]
name = "langchain-uncertainty-gate"
version = "0.1.0"
description = "LangChain agent middleware that samples risky tool calls, measures agreement, and acts, asks or escalates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Anya-Louni" }]
keywords = ["langchain", "langgraph", "agents", "middleware", "uncertainty"]
dependencies = [
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langgraph>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_uncertainty_gate"]
